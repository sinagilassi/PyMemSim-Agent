<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Case 1 CO2/CH4 hollow fiber membrane performance versus stage cut</title>
  <desc id="desc">Line chart showing permeate CO2 purity, CO2 recovery, and retentate CO2 mole fraction at 10, 50, and 70 percent stage cut.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#202124">
    Case 1 HFM Simulation: CO2/CH4 Performance vs Stage Cut
  </text>
  <text x="450" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5f6368">
    T = 301 K, Ps = 405.3 kPa, Pt = 101.3 kPa, feed = 1.30e-4 mol/s, co-current, isothermal
  </text>

  <rect x="90" y="80" width="720" height="360" fill="#fbfbfb" stroke="#dadce0"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#5f6368" stroke="#e0e0e0" stroke-width="1">
    <line x1="90" y1="440" x2="810" y2="440"/>
    <line x1="90" y1="368" x2="810" y2="368"/>
    <line x1="90" y1="296" x2="810" y2="296"/>
    <line x1="90" y1="224" x2="810" y2="224"/>
    <line x1="90" y1="152" x2="810" y2="152"/>
    <line x1="90" y1="80" x2="810" y2="80"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#5f6368">
    <text x="78" y="444" text-anchor="end">0</text>
    <text x="78" y="372" text-anchor="end">20</text>
    <text x="78" y="300" text-anchor="end">40</text>
    <text x="78" y="228" text-anchor="end">60</text>
    <text x="78" y="156" text-anchor="end">80</text>
    <text x="78" y="84" text-anchor="end">100</text>
    <text x="90" y="462" text-anchor="middle">10</text>
    <text x="570" y="462" text-anchor="middle">50</text>
    <text x="810" y="462" text-anchor="middle">70</text>
  </g>

  <g stroke="#202124" stroke-width="1.3">
    <line x1="90" y1="440" x2="810" y2="440"/>
    <line x1="90" y1="80" x2="90" y2="440"/>
  </g>

  <text x="450" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202124">
    Stage cut (%)
  </text>
  <text x="27" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202124" transform="rotate(-90 27 260)">
    Metric value (%)
  </text>

  <polyline points="90,153.9 570,171.2 810,186.0" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <polyline points="90,392.3 570,216.0 810,143.7" fill="none" stroke="#188038" stroke-width="3"/>
  <polyline points="90,231.8 570,276.9 810,312.6" fill="none" stroke="#d93025" stroke-width="3"/>

  <g stroke-width="2" fill="#ffffff">
    <circle cx="90" cy="153.9" r="5" stroke="#1a73e8"/>
    <circle cx="570" cy="171.2" r="5" stroke="#1a73e8"/>
    <circle cx="810" cy="186.0" r="5" stroke="#1a73e8"/>
    <circle cx="90" cy="392.3" r="5" stroke="#188038"/>
    <circle cx="570" cy="216.0" r="5" stroke="#188038"/>
    <circle cx="810" cy="143.7" r="5" stroke="#188038"/>
    <circle cx="90" cy="231.8" r="5" stroke="#d93025"/>
    <circle cx="570" cy="276.9" r="5" stroke="#d93025"/>
    <circle cx="810" cy="312.6" r="5" stroke="#d93025"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12">
    <text x="101" y="147" fill="#1a73e8">79.48</text>
    <text x="582" y="166" fill="#1a73e8">74.68</text>
    <text x="748" y="181" fill="#1a73e8">70.55</text>
    <text x="101" y="397" fill="#188038">13.25</text>
    <text x="582" y="211" fill="#188038">62.23</text>
    <text x="748" y="139" fill="#188038">82.31</text>
    <text x="101" y="226" fill="#d93025">57.83</text>
    <text x="582" y="292" fill="#d93025">45.32</text>
    <text x="748" y="328" fill="#d93025">35.38</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#202124">
    <rect x="575" y="92" width="220" height="76" fill="#ffffff" stroke="#dadce0"/>
    <line x1="592" y1="113" x2="632" y2="113" stroke="#1a73e8" stroke-width="3"/>
    <circle cx="612" cy="113" r="4" fill="#ffffff" stroke="#1a73e8" stroke-width="2"/>
    <text x="642" y="117">Permeate CO2 purity</text>
    <line x1="592" y1="135" x2="632" y2="135" stroke="#188038" stroke-width="3"/>
    <circle cx="612" cy="135" r="4" fill="#ffffff" stroke="#188038" stroke-width="2"/>
    <text x="642" y="139">CO2 recovery</text>
    <line x1="592" y1="157" x2="632" y2="157" stroke="#d93025" stroke-width="3"/>
    <circle cx="612" cy="157" r="4" fill="#ffffff" stroke="#d93025" stroke-width="2"/>
    <text x="642" y="161">Retentate CO2</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#5f6368">
    <text x="90" y="482" text-anchor="middle">z = 0.01196 m</text>
    <text x="570" y="482" text-anchor="middle">z = 0.06465 m</text>
    <text x="810" y="482" text-anchor="middle">z = 0.09634 m</text>
  </g>
</svg>
