REFERENCES:
  NIST-CO2-CH4-GAS:
    DATABOOK-ID: 1
    TABLES:
      general-data:
        TABLE-ID: 1
        DESCRIPTION:
          General gas-phase thermodynamic and physical data for carbon dioxide and methane. Molecular weights, critical properties, and gas-phase enthalpies of formation are from NIST Chemistry WebBook SRD 69 species pages for carbon dioxide (CAS 124-38-9) and methane (CAS 74-82-8), accessed 2026-07-07. Gibbs energies of formation and acentric factors are included from standard external thermodynamic references because they are required by the PyMemSim gas-phase schema.
        DATA: []
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,critical-temperature,critical-pressure,critical-molar-volume,molecular-weight,acentric-factor,enthalpy-of-formation,gibbs-energy-of-formation]
          SYMBOL: [None,None,None,None,Tc,Pc,Vc,MW,AcFa,EnFo_IG,GiEnFo_IG]
          UNIT: [None,None,None,None,K,bar,l/mol,g/mol,None,J/mol,J/mol]
          CONVERSION: [None,None,None,None,1,1,1,1,1,1,1]
        VALUES:
          - [1,'carbon dioxide','CO2','g',304.18,73.825,0.0919,44.0095,0.2236,-393510,-394390]
          - [2,'methane','CH4','g',190.6,46.1,0.09860,16.0425,0.0114,-74870,-50500]

      ideal-gas-heat-capacity:
        TABLE-ID: 2
        DESCRIPTION:
          Ideal-gas heat capacity Cp_IG using the NIST Chemistry WebBook gas-phase Shomate equation. Source equation is Cp = A + B*t + C*t^2 + D*t^3 + E/t^2 where t = T/1000, Cp is in J/mol.K, and T is in K. Coefficients are from Chase, 1998 as reported by NIST Chemistry WebBook SRD 69; accessed 2026-07-07. Low-temperature coefficient sets covering 298-1200 K for CO2 and 298-1300 K for CH4 are used for membrane-simulation temperatures near ambient and moderate heating.
        EQUATIONS:
          EQ-1:
            BODY:
              - "t = args['temperature | T | K'] / 1000"
              - "res['ideal-gas-heat-capacity | Cp_IG | J/mol.K'] = parms['A | A | J/mol.K'] + parms['B | B | J/mol.K'] * t + parms['C | C | J/mol.K'] * (t**2) + parms['D | D | J/mol.K'] * (t**3) + parms['E | E | J/mol.K'] / (t**2)"
            BODY-INTEGRAL:
              None
            BODY-FIRST-DERIVATIVE:
              None
            BODY-SECOND-DERIVATIVE:
              None
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,A,B,C,D,E,F,G,H,Tmin,Tmax,Eq]
          SYMBOL: [None,None,None,None,A,B,C,D,E,F,G,H,Tmin,Tmax,Cp_IG]
          UNIT: [None,None,None,None,J/mol.K,J/mol.K,J/mol.K,J/mol.K,J/mol.K,kJ/mol,J/mol.K,kJ/mol,K,K,J/mol.K]
        VALUES:
          - [1,'carbon dioxide','CO2','g',24.99735,55.18696,-33.69137,7.948387,-0.136638,-403.6075,228.2431,-393.5224,298,1200,1]
          - [2,'methane','CH4','g',-0.703029,108.4773,-42.52157,5.862788,0.678565,-76.84376,158.7163,-74.87310,298,1300,1]

      vapor-pressure:
        TABLE-ID: 3
        DESCRIPTION:
          Vapor pressure VaPr using NIST Chemistry WebBook Antoine equation parameters. Source equation is log10(P) = A - B/(T + C), where P is vapor pressure in bar and T is temperature in K. Coefficients are calculated by NIST from cited experimental sources on the species pages; accessed 2026-07-07. Validity ranges are retained because these vapor-pressure fits are subcritical saturation correlations and should not be extrapolated for ordinary supercritical gas-feed simulations.
        EQUATIONS:
          EQ-1:
            BODY:
              - "log10P = parms['A | A | 1'] - (parms['B | B | K'] / (args['temperature | T | K'] + parms['C | C | K']))"
              - "res['vapor-pressure | VaPr | bar'] = 10**log10P"
            BODY-INTEGRAL:
              None
            BODY-FIRST-DERIVATIVE:
              None
            BODY-SECOND-DERIVATIVE:
              None
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,A,B,C,Tmin,Tmax,Eq]
          SYMBOL: [None,None,None,None,A,B,C,Tmin,Tmax,VaPr]
          UNIT: [None,None,None,None,1,K,K,K,K,bar]
        VALUES:
          - [1,'carbon dioxide','CO2','g',6.81228,1301.679,-3.494,154.26,195.89,1]
          - [2,'methane','CH4','g',3.9895,443.028,-0.49,90.99,189.99,1]
