REFERENCES:
  NIST-O2-N2-GAS:
    DATABOOK-ID: 1
    TABLES:
      general-data:
        TABLE-ID: 1
        DESCRIPTION:
          General gas-phase thermodynamic and physical data for oxygen and nitrogen. Molecular weights, critical temperatures, critical pressures, and critical densities are from NIST Chemistry WebBook SRD 69 species pages for oxygen, CAS 7782-44-7, and nitrogen, CAS 7727-37-9, accessed 2026-07-07. Critical molar volumes are calculated as 1/rhoc from the NIST critical density values. Standard gas-phase enthalpy and Gibbs energy of formation are zero for O2(g) and N2(g) as elements in their standard reference states. Acentric factors are calculated from the Pitzer definition omega = -log10(Psat/Pc) - 1 at Tr = 0.7 using the NIST Antoine vapor-pressure coefficients and NIST critical pressures.
        DATA: []
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,critical-temperature,critical-pressure,critical-molar-volume,molecular-weight,acentric-factor,enthalpy-of-formation,gibbs-energy-of-formation]
          SYMBOL: [None,None,None,None,Tc,Pc,Vc,MW,AcFa,EnFo_IG,GiEnFo_IG]
          UNIT: [None,None,None,None,K,bar,l/mol,g/mol,None,J/mol,J/mol]
          CONVERSION: [None,None,None,None,1,1,1,1,1,1,1]
        VALUES:
          - [1,'oxygen','O2','g',154.58,50.43,0.0735294,31.9988,0.020315,0,0]
          - [2,'nitrogen','N2','g',126.19,33.978,0.0894454,28.0134,0.036339,0,0]

      ideal-gas-heat-capacity:
        TABLE-ID: 2
        DESCRIPTION:
          Ideal-gas heat capacity Cp_IG using the NIST Chemistry WebBook gas-phase Shomate equation. Source equation is Cp = A + B*t + C*t^2 + D*t^3 + E/t^2 where t = T/1000, Cp is in J/mol.K, and T is in K. Coefficients are from Chase, 1998 as reported by NIST Chemistry WebBook SRD 69; accessed 2026-07-07. The low-temperature coefficient sets are retained for membrane-simulation temperatures near ambient conditions.
        EQUATIONS:
          EQ-1:
            BODY:
              - "t = args['temperature | T | K'] / 1000"
              - "res['ideal-gas-heat-capacity | Cp_IG | J/mol.K'] = parms['A | A | J/mol.K'] + parms['B | B | J/mol.K'] * t + parms['C | C | J/mol.K'] * (t**2) + parms['D | D | J/mol.K'] * (t**3) + parms['E | E | J/mol.K'] / (t**2)"
            BODY-INTEGRAL:
              None
            BODY-FIRST-DERIVATIVE:
              None
            BODY-SECOND-DERIVATIVE:
              None
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,A,B,C,D,E,F,G,H,Tmin,Tmax,Eq]
          SYMBOL: [None,None,None,None,A,B,C,D,E,F,G,H,Tmin,Tmax,Cp_IG]
          UNIT: [None,None,None,None,J/mol.K,J/mol.K,J/mol.K,J/mol.K,J/mol.K,kJ/mol,J/mol.K,kJ/mol,K,K,J/mol.K]
        VALUES:
          - [1,'oxygen','O2','g',31.32234,-20.23531,57.86644,-36.50624,-0.007374,-8.903471,246.7945,0.0,100,700,1]
          - [2,'nitrogen','N2','g',28.98641,1.853978,-9.647459,16.63537,0.000117,-8.671914,226.4168,0.0,100,500,1]

      vapor-pressure:
        TABLE-ID: 3
        DESCRIPTION:
          Vapor pressure VaPr using NIST Chemistry WebBook Antoine equation parameters. Source equation is log10(P) = A - B/(T + C), where P is vapor pressure in bar and T is temperature in K. Coefficients are calculated by NIST from cited experimental sources on the species pages; accessed 2026-07-07. These are subcritical saturation correlations and should not be extrapolated outside their stated validity ranges for ordinary gas-feed membrane simulations.
        EQUATIONS:
          EQ-1:
            BODY:
              - "log10P = parms['A | A | 1'] - (parms['B | B | K'] / (args['temperature | T | K'] + parms['C | C | K']))"
              - "res['vapor-pressure | VaPr | bar'] = 10**log10P"
            BODY-INTEGRAL:
              None
            BODY-FIRST-DERIVATIVE:
              None
            BODY-SECOND-DERIVATIVE:
              None
        STRUCTURE:
          COLUMNS: [No.,Name,Formula,State,A,B,C,Tmin,Tmax,Eq]
          SYMBOL: [None,None,None,None,A,B,C,Tmin,Tmax,VaPr]
          UNIT: [None,None,None,None,1,K,K,K,K,bar]
        VALUES:
          - [1,'oxygen','O2','g',3.9523,340.024,-4.144,54.36,154.33,1]
          - [2,'nitrogen','N2','g',3.7362,264.651,-6.788,63.14,126.0,1]
